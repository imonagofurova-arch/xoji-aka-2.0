  html, body {
    margin: 0;
    height: 100%;
    background: #1a1a1f;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: 'Courier New', monospace;
  }

  .wrap {
    position: relative;
    z-index: 2;
    pointer-events: none; /* rasmlar ustiga sichqoncha o'tishi uchun */
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .glow-bg {
    position: fixed;
    top: 50%;
    left: 50%;
    z-index: 1;
    width: 600px;
    height: 600px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(180,150,255,0.15) 0%, rgba(26,26,31,0) 70%);
    pointer-events: none;
  }

  /* ===== Suzib tushuvchi rasmlar fon (ushlab surish + fizika) ===== */
  .gallery {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
  }

  .tile {
    position: absolute;
    left: 0;
    top: 0;
    width: var(--sz, 200px);
    height: var(--sz, 200px);
    border-radius: 50%;            /* bosish/ushlash joyi dumaloq */
    opacity: 0.55;
    filter: brightness(0.8) drop-shadow(0 0 3px rgba(216,202,255,0.45));
    transition: filter 0.35s ease, opacity 0.35s ease;
    will-change: transform;
    cursor: grab;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .tile .img {
    position: absolute;
    inset: 0;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    pointer-events: none;
  }

  /* sichqoncha olib borilgan rasm: yorug' */
  .tile.active {
    opacity: 1;
    filter: brightness(1.2) saturate(1.2) drop-shadow(0 0 16px rgba(180,150,255,0.85));
    z-index: 5;
  }

  /* ushlab turilgan rasm */
  .tile.dragging {
    cursor: grabbing;
    filter: brightness(1.3) saturate(1.25) drop-shadow(0 0 22px rgba(180,150,255,1));
    z-index: 6;
  }

  /* hover paytida qolgan rasmlar: blur (ushlab surayotganda blur yo'q) */
  .gallery.hovering .tile:not(.active) {
    opacity: 0.4;
    filter: blur(5px) brightness(0.5);
  }

  /* markazdagi yozuv o'qilishi uchun qorong'i qoplama */
  .gallery::after {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse at center, rgba(26,26,31,0.8) 0%, rgba(26,26,31,0.45) 55%, rgba(26,26,31,0.15) 100%),
      linear-gradient(to bottom, rgba(26,26,31,0.5), transparent 20%, transparent 80%, rgba(26,26,31,0.5));
    transition: opacity 0.4s ease;
  }

  .gallery.hovering::after,
  .gallery.dragging::after { opacity: 0.15; }
  /* ===== /Suzib tushuvchi rasmlar fon ===== */

  #text {
    width: 320px;
    text-align: left;
    font-size: 64px;
    font-weight: bold;
    color: #d8caff;
    letter-spacing: 4px;
    text-shadow: 0 0 20px rgba(180,150,255,0.6), 0 0 40px rgba(180,150,255,0.3);
  }

  .cursor {
    display: inline-block;
    width: 4px;
    background: #d8caff;
    margin-left: 4px;
    animation: blink 0.8s steps(2) infinite;
    box-shadow: 0 0 10px rgba(180,150,255,0.8);
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  .tagline {
    --mx: 0px; --my: 0px;
    transform: translate(var(--mx), var(--my));
    transition: transform 0.2s ease-out;
    margin-top: 18px;
    font-size: 16px;
    color: #8a7fa8;
    letter-spacing: 6px;
    text-transform: uppercase;
    opacity: 0;
    animation: fadeIn 1s ease forwards;
    animation-delay: 2.4s;
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }

  .socials {
    margin-top: 120px;
    display: flex;
    gap: 18px;
    opacity: 0;
    animation: fadeIn 1s ease forwards;
    animation-delay: 2.8s;
  }

  .socials a {
    pointer-events: auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 20px;
    border-radius: 8px;
    background: rgba(180,150,255,0.08);
    border: 1px solid rgba(180,150,255,0.35);
    color: #d8caff;
    text-decoration: none;
    font-size: 14px;
    letter-spacing: 1px;
    transition: all 0.25s ease;
  }

  .socials a:hover {
    background: rgba(180,150,255,0.25);
    box-shadow: 0 0 18px rgba(180,150,255,0.6);
    transform: translate(var(--mx), calc(var(--my) - 3px));
  }

  /* uzunroq tugma: socials qatori ostida */
  .daily {
    pointer-events: auto;
    box-sizing: border-box;
    width: 100%;
    margin-top: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 14px 20px;
    border-radius: 8px;
    background: rgba(180,150,255,0.08);
    border: 1px solid rgba(180,150,255,0.35);
    color: #d8caff;
    text-decoration: none;
    font-size: 14px;
    letter-spacing: 2px;
    opacity: 0;
    animation: fadeIn 1s ease forwards;
    animation-delay: 3.1s;
    transition: background 0.25s ease, box-shadow 0.25s ease, transform 0.25s ease;
  }

  .daily:hover {
    background: rgba(180,150,255,0.25);
    box-shadow: 0 0 18px rgba(180,150,255,0.6);
    transform: translate(var(--mx), calc(var(--my) - 3px));
  }

  .daily svg {
    width: 20px;
    height: 20px;
    fill: currentColor;
    flex-shrink: 0;
  }

  .socials svg {
    width: 20px;
    height: 20px;
    fill: currentColor;
    flex-shrink: 0;
  }

  #music-toggle {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: rgba(180,150,255,0.1);
    border: 1px solid rgba(180,150,255,0.4);
    color: #d8caff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.25s ease;
    z-index: 10;
  }

  #music-toggle:hover {
    background: rgba(180,150,255,0.25);
    box-shadow: 0 0 18px rgba(180,150,255,0.6);
  }

  #music-toggle svg {
    width: 22px;
    height: 22px;
    fill: currentColor;
  }

  /* ===== Tugma animatsiyalari: magnit, kursor ketidan nur, bosganda to'lqin, glitch ===== */
  .socials a, .daily, #music-toggle {
    --mx: 0px; --my: 0px; --gx: 50%; --gy: 50%;
    overflow: hidden;
    isolation: isolate;
    transform: translate(var(--mx), var(--my));
  }
  .socials a, .daily { position: relative; }
  .socials a, .daily { transition: transform 0.2s ease-out, background 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease; }

  .socials a::before, .daily::before, #music-toggle::before {
    content: '';
    position: absolute;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    opacity: 0;
    background: radial-gradient(110px circle at var(--gx) var(--gy), rgba(216,202,255,0.38), transparent 70%);
    transition: opacity 0.25s ease;
  }
  .socials a:hover::before, .daily:hover::before, #music-toggle:hover::before { opacity: 1; }

  .fx-ripple {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    background: radial-gradient(circle, rgba(236,226,255,0.6) 0%, rgba(180,150,255,0.3) 45%, rgba(180,150,255,0) 70%);
    transform: translate(-50%, -50%) scale(0);
    animation: fxRipple 0.65s ease-out forwards;
  }
  @keyframes fxRipple {
    to { transform: translate(-50%, -50%) scale(1); opacity: 0; }
  }

  /* glitch: faqat "daily photos by me" tugmasi */
  .daily span { position: relative; display: inline-block; }
  .daily span::before, .daily span::after {
    content: attr(data-text);
    position: absolute;
    left: 0; top: 0; width: 100%;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    mix-blend-mode: screen;
  }
  .daily span::before { color: #00e5ff; }
  .daily span::after  { color: #ff2d78; }
  .daily:hover span { animation: glitchShake 0.35s linear; }
  .daily:hover span::before { animation: ghostA 0.35s linear; }
  .daily:hover span::after  { animation: ghostB 0.35s linear; }
  @keyframes ghostA {
    0%, 100% { opacity: 0; transform: translate(0, 0); }
    20% { opacity: 1; transform: translate(-3px, -1px); }
    50% { opacity: 1; transform: translate(-2px, 1px); }
    80% { opacity: 1; transform: translate(-3px, 0); }
  }
  @keyframes ghostB {
    0%, 100% { opacity: 0; transform: translate(0, 0); }
    20% { opacity: 1; transform: translate(3px, 1px); }
    50% { opacity: 1; transform: translate(2px, -1px); }
    80% { opacity: 1; transform: translate(3px, 0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .daily:hover span, .daily:hover span::before, .daily:hover span::after { animation: none; }
    .fx-ripple { display: none; }
  }
  /* ===== /Tugma animatsiyalari ===== */

  #yt-player-container {
    position: fixed;
    top: -9999px;
    left: -9999px;
    width: 200px;
    height: 200px;
  }

  #loader {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, #2a1f3d 0%, #100a18 75%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    overflow: hidden;
    transition: opacity 0.6s ease, visibility 0.6s ease;
  }

  #loader.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .spider-bg {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 480px;
    height: 480px;
    transform: translate(-50%, -50%);
    opacity: 0.55;
    filter: drop-shadow(0 0 12px rgba(255,80,200,0.4));
    animation: spiderFloat 4s ease-in-out infinite;
    z-index: 1;
  }

  /* oyoqlar ochilish arafasida uzayadi (SMIL animatsiya, svg ichida) */
  .spider-bg { overflow: visible; }

  @keyframes spiderFloat {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -48%) scale(1.03); }
  }

  .nametag {
    position: relative;
    z-index: 2;
    font-family: 'Courier New', monospace;
    text-align: center;
  }

  .nametag .hello {
    font-size: 42px;
    font-weight: bold;
    letter-spacing: 3px;
    color: #ffe8e0;
    text-shadow: 0 0 12px rgba(255,60,90,0.7);
  }

  .nametag .subline {
    margin-top: 6px;
    font-size: 22px;
    color: #ffb3c6;
    letter-spacing: 2px;
  }

  .nametag .subline b {
    color: #ffffff;
  }

  .glitch-active .hello,
  .glitch-active .subline {
    animation: glitchShake 0.35s linear;
  }

  .glitch-active .hello::before,
  .glitch-active .hello::after {
    content: 'HELLO';
    position: absolute;
    left: 0; top: 0; width: 100%;
    animation: glitchShake 0.35s linear;
  }

  .glitch-active .hello::before {
    color: #00e5ff;
    transform: translate(-3px, -2px);
    mix-blend-mode: screen;
  }

  .glitch-active .hello::after {
    color: #ff2d78;
    transform: translate(3px, 2px);
    mix-blend-mode: screen;
  }

  @keyframes glitchShake {
    0% { transform: translate(0,0); }
    20% { transform: translate(-4px, 2px); }
    40% { transform: translate(4px, -2px); }
    60% { transform: translate(-3px, 1px); }
    80% { transform: translate(3px, -1px); }
    100% { transform: translate(0,0); }
  }

  .wtf-text {
    position: absolute;
    bottom: 70px;
    left: 50%;
    transform: translateX(-50%) scale(0.8);
    font-family: 'Courier New', monospace;
    font-size: 20px;
    letter-spacing: 3px;
    color: #ff2d78;
    text-shadow: 0 0 14px rgba(255,45,120,0.9);
    opacity: 0;
    z-index: 2;
  }

  .wtf-text.show {
    animation: wtfPop 0.6s ease forwards;
  }

  @keyframes wtfPop {
    0% { opacity: 0; transform: translateX(-50%) scale(0.6); }
    40% { opacity: 1; transform: translateX(-50%) scale(1.15); }
    70% { transform: translateX(-50%) scale(0.95); }
    100% { opacity: 1; transform: translateX(-50%) scale(1); }
  }
</style>

<script>
const word = "casflux";
const el = document.getElementById('text');
let i = 0;

function type() {
  if (i <= word.length) {
    el.innerHTML = word.slice(0, i) + '<span class="cursor">&nbsp;</span>';
    i++;
    setTimeout(type, 180);
  } else {
    // keep cursor blinking at the end, restart the loop after a pause
    setTimeout(() => {
      i = 0;
      eraseLoop();
    }, 2200);
  }
}

function eraseLoop() {
  let j = word.length;
  function erase() {
    if (j >= 0) {
      el.innerHTML = word.slice(0, j) + '<span class="cursor">&nbsp;</span>';
      j--;
      setTimeout(erase, 90);
    } else {
      setTimeout(() => { i = 0; type(); }, 500);
    }
  }
  erase();
}

type();
</script>

<script>
  // Loader intro sequence: show HELLO nametag, glitch once, show "wtf dude", then fade into the site
  const loaderEl = document.getElementById('loader');
  const nametagEl = document.getElementById('nametag');
  const wtfEl = document.getElementById('wtfText');

  setTimeout(() => {
    nametagEl.classList.add('glitch-active');
    setTimeout(() => nametagEl.classList.remove('glitch-active'), 350);
    wtfEl.classList.add('show');
  }, 1400);

  setTimeout(() => {
    loaderEl.classList.add('hidden');
  }, 3200);

  // O'rgimchak oyoqlari: glitch bilan birga uzaya boshlaydi, ochilish arafasida eng uzun bo'ladi.
  // Loader taymeri bilan bir xil soatda ishga tushadi, shuning uchun sahifa sekin yuklansa ham vaqti to'g'ri keladi.
  document.querySelectorAll('.spider-bg animate').forEach((a, i) => {
    setTimeout(() => { try { a.beginElement(); } catch (e) {} }, 1300 + i * 60);
  });
</script>

        '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300">' +
        '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
        '<stop offset="0" stop-color="' + p[0] + '"/><stop offset="1" stop-color="' + p[1] + '"/>' +
        '</linearGradient></defs>' +
        '<rect width="300" height="300" rx="28" fill="url(#g)"/>' +
        '</svg>';
      return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
    }

    function refresh() {
      const dragging = !!grabbed;
      gallery.classList.toggle('dragging', dragging);
      gallery.classList.toggle('hovering', !dragging && !!hovered);
      bodies.forEach(function (b) {
        const active = b === grabbed || (!dragging && b === hovered);
        b.el.classList.toggle('dragging', b === grabbed);
        b.el.classList.toggle('active', active);
        b.ts = b === grabbed ? DRAG_SCALE : (active ? HOVER_SCALE : BASE_SCALE);
      });
    }

    function startDrag(b, e) {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      e.preventDefault();
      try { b.el.setPointerCapture(e.pointerId); } catch (err) {}
      grabbed = b;
      grabOff = { x: b.x - e.clientX, y: b.y - e.clientY };
      target = { x: b.x, y: b.y };
      b.vx = 0; b.vy = 0;
      samples = [{ t: e.timeStamp, x: e.clientX, y: e.clientY }];
      refresh();
    }

    function endDrag() {
      if (!grabbed) return;
      const g = grabbed;
      grabbed = null;
      let vx = g.vx, vy = g.vy;
      if (samples.length > 1) {
        const a = samples[0], z = samples[samples.length - 1];
        const dtp = (z.t - a.t) / 1000;
        if (dtp > 0.02) { vx = (z.x - a.x) / dtp; vy = (z.y - a.y) / dtp; }
      }
      const sp = Math.hypot(vx, vy);
      if (sp > MAX_THROW) { vx *= MAX_THROW / sp; vy *= MAX_THROW / sp; }
      g.vx = vx; g.vy = vy;   // qo'yib yuborilganda otilib ketadi
      refresh();
    }

    function visible(b) {
      return b.x > -sz && b.x < W + sz && b.y > -sz && b.y < H + sz;
    }

    // yo'lning boshidan oxirigacha uzluksiz aylanish
    function wrap(b) {
      const rx = b.x - W / 2, ry = b.y - H / 2;
      const w = rx * dir.x + ry * dir.y;
      const u = rx * perp.x + ry * perp.y;
      const half = fieldLen / 2;
      if (Math.abs(u) > laneCount * laneW / 2 + laneW * 1.5) {
        // yon tomonga uchib ketdi: o'z yo'lining boshiga qaytariladi
        b.x = W / 2 + b.home * perp.x - half * dir.x;
        b.y = H / 2 + b.home * perp.y - half * dir.y;
        b.vx = dir.x * b.speed; b.vy = dir.y * b.speed;
      } else if (w > half) {
        b.x -= dir.x * fieldLen; b.y -= dir.y * fieldLen;
      } else if (w < -half) {
        b.x += dir.x * fieldLen; b.y += dir.y * fieldLen;
      }
    }

    // dumaloq jismlarning to'qnashuvi
    function collide() {
      const n = bodies.length, rr = radius * 2;
      for (let i = 0; i < n; i++) {
        const a = bodies[i];
        for (let j = i + 1; j < n; j++) {
          const b = bodies[j];
          let dx = b.x - a.x, dy = b.y - a.y;
          if (dx > rr || dx < -rr || dy > rr || dy < -rr) continue;
          if (dx * dx + dy * dy >= rr * rr) continue;
          let d = Math.sqrt(dx * dx + dy * dy);
          if (d < 0.001) { dx = Math.random() - 0.5; dy = Math.random() - 0.5; d = Math.hypot(dx, dy) || 1; }
          const nx = dx / d, ny = dy / d;
          const wa = a === grabbed ? 0 : 1, wb = b === grabbed ? 0 : 1, ws = wa + wb;
          if (ws === 0) continue;
          const overlap = rr - d;
          a.x -= nx * overlap * wa / ws; a.y -= ny * overlap * wa / ws;
          b.x += nx * overlap * wb / ws; b.y += ny * overlap * wb / ws;
          const vrel = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
          if (vrel < 0) {
            const imp = -(1 + RESTITUTION) * vrel / ws;
            a.vx -= imp * wa * nx; a.vy -= imp * wa * ny;
            b.vx += imp * wb * nx; b.vy += imp * wb * ny;
          }
        }
      }
    }

    function step(dt) {
      const pulled = grabbed ? ATTRACT[grabbed.type] : null;
      const drift = reduceMotion ? 0 : 1;

      // 1) har bir rasm o'z tezligiga intiladi: oqim, to'xtash (hover) yoki ushlangan rasmga tortilish
      for (let i = 0; i < bodies.length; i++) {
        const b = bodies[i];
        if (b === grabbed) continue;
        let tvx = dir.x * b.speed * drift, tvy = dir.y * b.speed * drift, k = 0.6;
        if (b === hovered && !grabbed) { tvx = 0; tvy = 0; k = 8; }   // ushlash oson bo'lishi uchun to'xtaydi
        if (pulled && pulled.indexOf(b.type) !== -1 && visible(b)) {
          const dx = grabbed.x - b.x, dy = grabbed.y - b.y;
          const d = Math.hypot(dx, dy) || 1;
          const sp = Math.min(ATTRACT_SPEED, d * 2.5);
          tvx = dx / d * sp; tvy = dy / d * sp; k = 5;
        }
        const f = 1 - Math.exp(-k * dt);
        b.vx += (tvx - b.vx) * f;
        b.vy += (tvy - b.vy) * f;
      }

      // 2) ushlangan rasm sichqoncha ortidan boradi
      if (grabbed) {
        const g = grabbed, f = 1 - Math.exp(-30 * dt);
        const nx = g.x + (target.x - g.x) * f, ny = g.y + (target.y - g.y) * f;
        let vx = (nx - g.x) / dt, vy = (ny - g.y) / dt;
        const sp = Math.hypot(vx, vy);
        if (sp > MAX_THROW) { vx *= MAX_THROW / sp; vy *= MAX_THROW / sp; }
        g.vx = vx; g.vy = vy; g.x = nx; g.y = ny;
      }

      // 3) siljish
      for (let i = 0; i < bodies.length; i++) {
        const b = bodies[i];
        if (b === grabbed) continue;
        b.x += b.vx * dt; b.y += b.vy * dt;
      }

      // 4) to'qnashuvlar
      collide(); collide(); collide();

      // 5) aylanish
      for (let i = 0; i < bodies.length; i++) {
        if (bodies[i] !== grabbed) wrap(bodies[i]);
      }
    }

    function render(dt) {
      const f = 1 - Math.exp(-12 * dt);
      for (let i = 0; i < bodies.length; i++) {
        const b = bodies[i];
        b.scale += (b.ts - b.scale) * f;
        const lean = Math.max(-10, Math.min(10, b.vx * 0.02));   // harakat tomoniga biroz engashadi
        b.el.style.transform =
          'translate3d(' + (b.x - sz / 2).toFixed(1) + 'px,' + (b.y - sz / 2).toFixed(1) + 'px,0) ' +
          'rotate(' + (b.rot + lean).toFixed(1) + 'deg) scale(' + b.scale.toFixed(3) + ')';
      }
    }

    function build() {
      gallery.querySelectorAll('.tile').forEach(function (n) { n.remove(); });
      bodies = []; grabbed = null; hovered = null;
      gallery.classList.remove('hovering', 'dragging');

      W = window.innerWidth; H = window.innerHeight;
      const phi = TILT * Math.PI / 180;
      dir = { x: -Math.sin(phi), y: Math.cos(phi) };     // pastga va chapga
      perp = { x: Math.cos(phi), y: Math.sin(phi) };     // yo'llarga ko'ndalang

      const S = Math.ceil(Math.hypot(W, H)) + 20;
      const proj = W * Math.cos(phi) + H * Math.sin(phi);
      laneW = proj / VISIBLE_LANES;
      laneCount = Math.ceil(S / laneW);
      sz = Math.round(laneW);
      radius = sz * BASE_SCALE * 0.45;
      const stepLen = sz + GAP;
      const perLane = Math.ceil(S / stepLen) + 1;
      fieldLen = perLane * stepLen;
      gallery.style.setProperty('--sz', sz + 'px');

      for (let l = 0; l < laneCount; l++) {
        const u = (l - (laneCount - 1) / 2) * laneW;
        const type = IMAGES.length ? l % IMAGES.length : 0;
        const src = IMAGES.length ? IMAGES[type] : placeholder(l);
        const speed = 26 + Math.random() * 22;
        const off = Math.random() * stepLen;
        for (let k = 0; k < perLane; k++) {
          const w = -fieldLen / 2 + off + k * stepLen;
          const el = document.createElement('div');
          el.className = 'tile';
          const img = document.createElement('div');
          img.className = 'img';
          img.style.backgroundImage = 'url("' + src + '")';
          el.appendChild(img);
          gallery.appendChild(el);

          const b = {
            el: el, type: type, home: u, speed: speed,
            x: W / 2 + u * perp.x + w * dir.x,
            y: H / 2 + u * perp.y + w * dir.y,
            vx: reduceMotion ? 0 : dir.x * speed,
            vy: reduceMotion ? 0 : dir.y * speed,
            rot: Math.random() * 16 - 8,
            scale: BASE_SCALE, ts: BASE_SCALE
          };
          el.addEventListener('pointerenter', function () { hovered = b; refresh(); });
          el.addEventListener('pointerleave', function () { if (hovered === b) hovered = null; refresh(); });
          el.addEventListener('pointerdown', function (e) { startDrag(b, e); });
          bodies.push(b);
        }
      }
      render(0.016);
    }

    function frame(now) {
      raf = requestAnimationFrame(frame);
      let dt = (now - last) / 1000;
      last = now;
      if (!(dt > 0)) dt = 1 / 60;
      dt = Math.min(dt, 1 / 30);
      step(dt);
      render(dt);
    }
    function start() { if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); } }
    function stop() { if (raf) { cancelAnimationFrame(raf); raf = 0; } }

    window.addEventListener('pointermove', function (e) {
      if (!grabbed) return;
      target.x = e.clientX + grabOff.x;
      target.y = e.clientY + grabOff.y;
      samples.push({ t: e.timeStamp, x: e.clientX, y: e.clientY });
      while (samples.length > 2 && e.timeStamp - samples[0].t > 120) samples.shift();
    });
    window.addEventListener('pointerup', endDrag);
    window.addEventListener('pointercancel', endDrag);
    window.addEventListener('blur', endDrag);
    gallery.addEventListener('dragstart', function (e) { e.preventDefault(); });
    document.addEventListener('visibilitychange', function () { document.hidden ? stop() : start(); });

    let lastW = window.innerWidth, lastH = window.innerHeight;
    window.addEventListener('resize', function () {
      clearTimeout(timer);
      timer = setTimeout(function () {
        if (Math.abs(window.innerWidth - lastW) > 40 || Math.abs(window.innerHeight - lastH) > 120) {
          lastW = window.innerWidth; lastH = window.innerHeight;
          build();
        }
      }, 250);
    });

    build();
    start();
  })();
</script>

<script>

  const VIDEO_ID = "hXCIH5VTWyg";
  let ytPlayer;
  let isPlaying = false;
  let playerReady = false;
  let pendingToggle = false;
  let hasStarted = false;

  const tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  document.body.appendChild(tag);

  function onYouTubeIframeAPIReady() {
    ytPlayer = new YT.Player('yt-player', {
      height: '200',
      width: '200',
      videoId: VIDEO_ID,
      playerVars: {
        autoplay: 0,
        loop: 1,
        playlist: VIDEO_ID,
        controls: 0
      },
      events: {
        onReady: (e) => {
          playerReady = true;
          if (pendingToggle) {
            pendingToggle = false;
            doToggle();
          }
        }
      }
    });
  }
  window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;

  const toggleBtn = document.getElementById('music-toggle');
  const iconOn = document.getElementById('music-icon-on');
  const iconOff = document.getElementById('music-icon-off');

  function doToggle() {
    if (!hasStarted) {
      // very first play must happen directly inside the click handler (user gesture)
      ytPlayer.setVolume(100);
      ytPlayer.unMute();
      ytPlayer.playVideo();
      hasStarted = true;
      isPlaying = true;
      iconOn.style.display = 'none';
      iconOff.style.display = 'block';
      return;
    }
    if (isPlaying) {
      ytPlayer.pauseVideo();
      isPlaying = false;
      iconOn.style.display = 'block';
      iconOff.style.display = 'none';
    } else {
      ytPlayer.playVideo();
      isPlaying = true;
      iconOn.style.display = 'none';
      iconOff.style.display = 'block';
    }
  }

  toggleBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (!playerReady || !ytPlayer) {
      pendingToggle = true;
      return;
    }
    doToggle();
  });

  // Start music automatically on the very first tap/click anywhere on the page
  function startOnFirstInteraction() {
    if (hasStarted) return;
    if (!playerReady || !ytPlayer) {
      pendingToggle = true;
      return;
    }
    doToggle();
  }
  document.addEventListener('click', startOnFirstInteraction, { once: true });
  document.addEventListener('touchstart', startOnFirstInteraction, { once: true });
</script>

<script>
  // ===== Tugma animatsiyalari: magnit, kursor ketidan nur, bosganda to'lqin =====
  (function () {
    const btns = Array.prototype.slice.call(document.querySelectorAll('.socials a, .daily, #music-toggle'));
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const RANGE = 70;   // tugmaga shu masofada yaqinlashganda tortila boshlaydi (px)
    const PULL = 0.22;  // tortilish kuchi
    const MAXP = 10;    // eng ko'p siljish (px)
    const clamp = function (v, m) { return Math.max(-m, Math.min(m, v)); };

    const tagline = document.querySelector('.tagline');
    const mags = tagline ? btns.concat(tagline) : btns;   // magnit: tugmalar + "xoji aka"
    mags.forEach(function (b) { b._mx = 0; b._my = 0; });

    function setPull(b, x, y) {
      b._mx = x; b._my = y;
      b.style.setProperty('--mx', x.toFixed(1) + 'px');
      b.style.setProperty('--my', y.toFixed(1) + 'px');
    }

    window.addEventListener('pointermove', function (e) {
      if (e.pointerType === 'touch') return;
      mags.forEach(function (b) {
        const r = b.getBoundingClientRect();
        // siljish ta'sirini hisobdan chiqaramiz, aks holda titrab qoladi
        const cx = r.left + r.width / 2 - b._mx, cy = r.top + r.height / 2 - b._my;
        const hw = r.width / 2, hh = r.height / 2;
        const dx = e.clientX - cx, dy = e.clientY - cy;
        const near = Math.abs(dx) < hw + RANGE && Math.abs(dy) < hh + RANGE;
        if (!reduce) {
          if (near) setPull(b, clamp(dx * PULL, MAXP), clamp(dy * PULL, MAXP * 0.8));
          else if (b._mx || b._my) setPull(b, 0, 0);
        }
        if (Math.abs(dx) <= hw && Math.abs(dy) <= hh) {
          b.style.setProperty('--gx', (dx + hw).toFixed(0) + 'px');
          b.style.setProperty('--gy', (dy + hh).toFixed(0) + 'px');
        }
      });
    });

    function reset() { mags.forEach(function (b) { if (b._mx || b._my) setPull(b, 0, 0); }); }
    document.documentElement.addEventListener('mouseleave', reset);
    window.addEventListener('blur', reset);

    // bosganda to'lqin
    btns.forEach(function (b) {
      b.addEventListener('pointerdown', function (e) {
        if (reduce) return;
        const r = b.getBoundingClientRect();
        const x = e.clientX - r.left, y = e.clientY - r.top;
        const d = 2 * Math.hypot(Math.max(x, r.width - x), Math.max(y, r.height - y));
        const rp = document.createElement('i');
        rp.className = 'fx-ripple';
        rp.style.width = rp.style.height = d + 'px';
        rp.style.left = x + 'px';
        rp.style.top = y + 'px';
        b.appendChild(rp);
        rp.addEventListener('animationend', function () { rp.remove(); });
      });
    });
  })();
</script>
